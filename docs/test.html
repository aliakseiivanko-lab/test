<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тесты — Школа робота Бипа</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff7e6; --card:#ffffff; --text:#23283a; --muted:#6b7089;
  --accent:#ff7a1a; --accent2:#ffb020; --good:#1f9d55; --bad:#e03131;
  --line:#f0e3c8;
  --ac:#ff7a1a; --ac2:#ffb020;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--text);
  font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;
  font-size:17px; line-height:1.55; overflow-x:hidden; min-height:100vh;
}
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(circle at 12% 18%, rgba(255,176,32,.16), transparent 30%),
    radial-gradient(circle at 88% 12%, rgba(255,122,26,.12), transparent 28%),
    radial-gradient(circle at 82% 88%, rgba(125,255,154,.12), transparent 30%),
    radial-gradient(circle at 8% 92%, rgba(94,224,255,.12), transparent 28%);
}
.g{
  position:fixed; z-index:0; pointer-events:none; user-select:none;
  font-family:ui-monospace,Menlo,Consolas,monospace; font-weight:800;
  color:rgba(255,122,26,.13); animation:float linear infinite;
}
@keyframes float{
  from{transform:translateY(110vh) rotate(-8deg)}
  to{transform:translateY(-15vh) rotate(10deg)}
}
.wrap{position:relative;z-index:1;max-width:1060px;margin:0 auto;padding:0 20px}
.hidden{display:none !important}
.muted{color:var(--muted)}

/* ---------- шапка ---------- */
header{display:flex;align-items:center;gap:12px;padding:18px 0}
.brand{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none}
.logo{
  width:46px;height:46px;border-radius:16px;flex:none;
  display:grid;place-items:center;
  background:linear-gradient(145deg,var(--accent),var(--accent2));
  box-shadow:0 5px 0 rgba(35,40,58,.15);
}
.logo svg{width:28px;height:28px;stroke:#fff;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.logo svg .dot{fill:#fff;stroke:none}
header b{font-family:"Fredoka",system-ui,sans-serif;font-size:22px;letter-spacing:.01em}
header .tag{
  margin-left:auto;font-size:13px;font-weight:800;color:var(--muted);
  display:flex;align-items:center;gap:8px;
}
header .tag i{
  width:9px;height:9px;border-radius:50%;background:var(--good);
  box-shadow:0 0 0 4px rgba(31,157,85,.15);animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{50%{transform:scale(1.4)}}

/* ---------- робот ---------- */
.robot{width:150px;display:block;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 16px 22px rgba(35,40,58,.18))}
@keyframes bob{50%{transform:translateY(-10px)}}
.robot .eye{fill:#5ee0ff;animation:blink 4.6s infinite}
@keyframes blink{0%,91%,100%{opacity:1}94%,97%{opacity:.12}}
.robot .ball{fill:#ffb020;transform-box:fill-box;transform-origin:center;animation:ballPulse 1.8s ease-in-out infinite}
@keyframes ballPulse{50%{transform:scale(1.28);filter:drop-shadow(0 0 8px #ffb020)}}
.robot .armR{transform-box:fill-box;transform-origin:50% 10%;animation:wave 2.3s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-26deg)}}
.robot .face-s,.robot .face-a,.robot .brow,.robot .steam{display:none}
.robot.happy .face-n,.robot.sad .face-n{display:none}
.robot.happy .face-s{display:block}
.robot.sad .face-a{display:block}

.robot-zone{position:relative;flex:none;width:190px;display:flex;flex-direction:column;align-items:center;gap:16px}
.bubble{
  position:relative;width:100%;min-width:0;height:100px;
  display:flex;align-items:center;justify-content:center;text-align:center;
  background:var(--card);border:2px solid var(--line);border-radius:18px;
  padding:12px 14px;font-weight:800;font-size:16px;
  box-shadow:0 12px 28px rgba(35,40,58,.10);
  animation:sayFloat 3s ease-in-out infinite;
}
.bubble::before{
  content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:8px solid transparent;border-top:10px solid var(--line);border-bottom:0;
}
.bubble .caret{display:inline-block;width:2px;height:1em;background:var(--accent);vertical-align:-2px;margin-left:2px;animation:caret .8s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
@keyframes sayFloat{50%{transform:translateY(-6px)}}

/* ---------- герой ---------- */
.hero{display:flex;align-items:flex-start;gap:44px;padding:20px 0 28px}
.hero h1,.title{
  font-family:"Fredoka",system-ui,sans-serif;
  font-size:clamp(2rem,5vw,3.2rem);line-height:1.08;letter-spacing:-.01em;margin:14px 0 14px;
}
.hero h1 em,.title em{font-style:normal;color:var(--accent);text-shadow:0 3px 0 rgba(255,122,26,.15)}
.hero p{color:var(--muted);max-width:540px;font-size:1.05rem}

/* ---------- кнопки ---------- */
button{font-family:inherit;color:inherit}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
  font-weight:800;font-size:1rem;border:0;border-radius:16px;padding:14px 24px;cursor:pointer;
  box-shadow:0 5px 0 rgba(35,40,58,.15);
  transition:transform .15s ease,box-shadow .15s ease,opacity .15s;
}
.btn:hover{transform:translateY(2px);box-shadow:0 3px 0 rgba(35,40,58,.15)}
.btn:active{transform:translateY(5px);box-shadow:0 0 0 rgba(35,40,58,.15)}
.btn:disabled{opacity:.5;cursor:default}
.btn.sec{
  background:var(--card);color:var(--text);border:2px solid var(--line);
  box-shadow:0 5px 0 rgba(35,40,58,.06);
}
.btn.sec:hover{border-color:var(--accent)}
.btns{display:flex;flex-wrap:wrap;gap:14px;margin-top:6px}
.err{color:var(--bad);font-weight:800;margin-top:12px;min-height:1.2em}

/* ---------- секции ---------- */
section{padding:10px 0 26px}
h2{font-family:"Fredoka",system-ui,sans-serif;font-size:clamp(1.5rem,3.4vw,2.1rem);margin-bottom:6px}
.sub{color:var(--muted);margin-bottom:22px}

/* ---------- выбор класса ---------- */
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 24px}
.chip{
  background:var(--card);border:2px solid var(--line);border-radius:999px;
  padding:9px 20px;font-size:.98rem;font-weight:800;color:var(--muted);cursor:pointer;
  box-shadow:0 4px 0 rgba(35,40,58,.05);
  transition:transform .15s ease,border-color .15s ease,color .15s ease;
}
.chip:hover{border-color:var(--accent);color:var(--text);transform:translateY(-2px)}
.chip.on{
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;
  box-shadow:0 5px 0 rgba(35,40,58,.15);
}

/* ---------- карточки тестов ---------- */
.courses{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px}
.card{
  --ac:#ff7a1a; --ac2:#ffb020;
  position:relative;background:var(--card);border:2px solid var(--line);
  border-radius:26px;padding:24px;
  box-shadow:0 6px 0 rgba(35,40,58,.05);
}
.card.c7{--ac:#e64980;--ac2:#f783ac}
.card.c8{--ac:#9c5cf0;--ac2:#c4a1ff}
.card.c9{--ac:#12b886;--ac2:#5eead4}
.card.c10{--ac:#4f7df9;--ac2:#a78bfa}
.tcard{
  display:flex;flex-direction:column;align-items:stretch;gap:14px;
  width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit;
  transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease;
}
.tcard:hover,.tcard:focus-visible{
  transform:translateY(-8px);border-color:var(--ac);
  box-shadow:0 20px 44px rgba(35,40,58,.13);outline:none;
}
.tcard .num{
  position:absolute;top:20px;right:20px;
  font-family:"Fredoka",system-ui,sans-serif;font-size:28px;font-weight:700;
  color:#fff;background:linear-gradient(145deg,var(--ac),var(--ac2));
  width:64px;height:64px;border-radius:20px;display:grid;place-items:center;
  box-shadow:0 5px 0 rgba(35,40,58,.12);transition:transform .25s ease;
}
.tcard:hover .num{transform:rotate(-6deg) scale(1.06)}
.tcard h3{font-family:"Fredoka",system-ui,sans-serif;font-size:1.25rem;line-height:1.25;padding-right:74px;min-height:3.4em;font-weight:600}
.who{
  display:inline-flex;align-items:center;gap:8px;align-self:flex-start;
  font-size:.82rem;font-weight:800;color:var(--ac);
  background:color-mix(in srgb,var(--ac) 10%,#fff);
  border-radius:999px;padding:5px 12px;
}
.tcard .go{
  margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;
  font-weight:800;font-size:1rem;border-radius:16px;padding:14px 18px;
  box-shadow:0 5px 0 rgba(35,40,58,.15);transition:transform .15s ease,box-shadow .15s ease;
}
.go svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s ease}
.tcard:hover .go{transform:translateY(2px);box-shadow:0 3px 0 rgba(35,40,58,.15)}
.tcard:hover .go svg{transform:translateX(5px)}

/* ---------- экран теста ---------- */
#bar{
  position:sticky;top:12px;z-index:5;margin-bottom:20px;
  background:var(--card);border:2px solid var(--line);border-radius:20px;
  padding:14px 18px;box-shadow:0 10px 24px rgba(35,40,58,.10);
}
#bar .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
#bar b{font-family:"Fredoka",system-ui,sans-serif;font-size:1.05rem;font-weight:600}
#bar .cnt{font-weight:800;color:var(--muted);font-size:.92rem;white-space:nowrap}
.pbar{height:10px;margin-top:10px;border-radius:999px;background:var(--line);overflow:hidden}
.pbar span{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s ease}
.testhead{margin:4px 0 22px}
.testhead .title{font-size:clamp(1.5rem,3.6vw,2.3rem);margin:0 0 6px}

.q{
  position:relative;background:var(--card);border:2px solid var(--line);border-radius:26px;
  padding:24px 24px 18px;margin-bottom:18px;box-shadow:0 6px 0 rgba(35,40,58,.05);
}
.qhead{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
.qn{
  flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;
  font-family:"Fredoka",system-ui,sans-serif;font-size:19px;font-weight:700;color:#fff;
  background:linear-gradient(145deg,var(--accent),var(--accent2));
  box-shadow:0 4px 0 rgba(35,40,58,.12);
}
.qt{white-space:pre-wrap;font-weight:800;font-size:1.06rem;padding-top:7px}
.qimg{max-width:100%;max-height:320px;display:block;margin:0 0 14px;border-radius:16px;border:2px solid var(--line)}
.hint{font-size:.88rem;font-weight:700;color:var(--muted);margin:0 0 10px}

.opt{
  display:flex;align-items:flex-start;gap:12px;padding:11px 14px;
  background:var(--bg);border:2px solid var(--line);border-radius:16px;margin-bottom:8px;cursor:pointer;
  font-weight:700;transition:border-color .15s ease,background .15s ease,transform .15s ease;
}
.opt input{margin-top:5px;transform:scale(1.25);accent-color:var(--accent)}
.opt:hover{border-color:var(--accent);transform:translateX(3px)}
.opt:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,#fff)}

input[type=text],select{
  width:100%;padding:12px 14px;font:inherit;font-weight:700;color:var(--text);
  background:var(--bg);border:2px solid var(--line);border-radius:16px;outline:none;
  transition:border-color .15s ease,box-shadow .15s ease;
}
input[type=text]:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(255,122,26,.15)}
.mrow{display:flex;gap:12px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.mrow .l{flex:1 1 200px;font-weight:700}
.mrow select{flex:1 1 200px;width:auto}
.submitbox{padding:6px 0 10px}

/* ---------- результат ---------- */
.result{display:flex;align-items:center;gap:36px;padding:10px 0 26px}
.result .robot{width:150px}
.result .big{font-family:"Fredoka",system-ui,sans-serif;font-size:clamp(2rem,6vw,3.4rem);font-weight:700;line-height:1.1;margin:6px 0 4px;color:var(--accent)}
.result .msg{color:var(--muted);font-weight:700;margin-bottom:18px}
.res{
  position:relative;background:var(--card);border:2px solid var(--line);border-radius:22px;
  padding:16px 20px;margin-bottom:14px;box-shadow:0 5px 0 rgba(35,40,58,.05);
}
.res.ok{border-left:8px solid var(--good)}
.res.bad{border-left:8px solid var(--bad)}
.badge{font-family:"Fredoka",system-ui,sans-serif;font-weight:600;font-size:1rem;margin-bottom:4px}
.ok .badge{color:var(--good)} .bad .badge{color:var(--bad)}
.res .qt{padding-top:0;margin-bottom:8px}

footer{margin-top:10px;padding:22px 0 34px;text-align:center;color:var(--muted);font-size:.9rem}
footer b{color:var(--accent)}

@media (max-width:840px){
  .hero{flex-direction:column;align-items:center;text-align:center;gap:24px}
  .hero p{margin:0 auto}
  .result{flex-direction:column;text-align:center;gap:14px}
}
@media (max-width:480px){
  .q{padding:18px 16px 12px;border-radius:22px}
  .tcard .num{width:54px;height:54px;font-size:24px;border-radius:16px}
  .tcard h3{padding-right:60px}
  header .tag{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.001ms!important}
  .g{display:none}
}
</style>
</head>
<body>

<div class="wrap">

  <header>
    <a class="brand" href="../index.html" title="На главную">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <rect x="5" y="8" width="14" height="10" rx="3"/>
          <circle class="dot" cx="9.5" cy="12.5" r="1.3"/>
          <circle class="dot" cx="14.5" cy="12.5" r="1.3"/>
          <path d="M12 8V4M12 4a1.4 1.4 0 1 0 .01 0"/>

  <!-- ===== список тестов ===== -->
  <div id="screenList">

        <svg class="robot" viewBox="0 0 120 140" aria-hidden="true">
          <line x1="60" y1="8" x2="60" y2="26" stroke="#8a93b8" stroke-width="4"/><circle class="ball" cx="60" cy="8" r="7"/>
<g class="armL"><rect x="6" y="84" width="14" height="38" rx="7" fill="#8a93b8"/></g>
<g class="armR"><rect x="100" y="84" width="14" height="38" rx="7" fill="#8a93b8"/></g>
<rect x="26" y="80" width="68" height="50" rx="12" fill="#c9d0ee"/><rect x="44" y="94" width="32" height="20" rx="6" fill="#ff7a1a"/>
<rect x="18" y="24" width="84" height="60" rx="18" fill="#dfe4f7" stroke="#8a93b8" stroke-width="3"/>
<rect x="28" y="36" width="64" height="36" rx="12" fill="#1d2233"/>
<circle class="eye" cx="46" cy="52" r="8"/><circle class="eye" cx="74" cy="52" r="8"/>
<path class="brow" d="M36 38 L54 46 M84 38 L66 46" stroke="#ff4b4b" stroke-width="4" stroke-linecap="round"/>
<rect class="face-n" x="50" y="62" width="20" height="3" rx="1.5" fill="#5ee0ff"/>
<path class="face-s" d="M48 62 Q60 74 72 62" stroke="#7dff9a" stroke-width="4" fill="none" stroke-linecap="round"/>
<path class="face-a" d="M48 68 Q60 58 72 68" stroke="#ff4b4b" stroke-width="4" fill="none" stroke-linecap="round"/>
<g class="steam"><circle cx="16" cy="30" r="7"/><circle cx="104" cy="30" r="7"/><circle cx="24" cy="14" r="5"/><circle cx="96" cy="14" r="5"/></g>
        </svg>
      </div>
      <div>
        <h1>Тесты — <em>проверь себя</em></h1>
        <p>Выбери класс, затем тест. Тест начнётся сразу — в нём случайные вопросы. В конце Бип покажет, сколько ответов верные.</p>
      </div>

    <section>
      <h2>Выбери класс</h2>

      <div id="chips" class="chips"></div>
      <div id="tests" class="courses"></div>
      <div class="err" id="listErr"></div>
    </section>
  </div>

  <!-- ===== прохождение ===== -->
  <div id="screenTest" class="hidden">
    <div id="bar">
      <div class="top"><b id="barTitle"></b><span class="cnt" id="barCnt"></span></div>
      <div class="pbar"><span id="barFill"></span></div>
    </div>
    <div class="testhead">
      <h1 class="title" id="testTitle"></h1>
      <div class="muted" id="testInfo"></div>
    </div>
    <div id="questions"></div>
    <div class="submitbox">
      <div class="btns">
        <button id="btnSubmit" class="btn">Завершить и проверить</button>
        <button id="btnBack" class="btn sec">К списку тестов</button>
      </div>
      <div class="err" id="submitErr"></div>
    </div>
  </div>

  <!-- ===== результат ===== -->
  <div id="screenDone" class="hidden">
    <div class="result">
      <svg class="robot" id="doneRobot" viewBox="0 0 120 140" aria-hidden="true">
        <line x1="60" y1="8" x2="60" y2="26" stroke="#8a93b8" stroke-width="4"/><circle class="ball" cx="60" cy="8" r="7"/>

<rect x="18" y="24" width="84" height="60" rx="18" fill="#dfe4f7" stroke="#8a93b8" stroke-width="3"/>

<circle class="eye" cx="46" cy="52" r="8"/><circle class="eye" cx="74" cy="52" r="8"/>

<rect class="face-n" x="50" y="62" width="20" height="3" rx="1.5" fill="#5ee0ff"/>
<path class="face-s" d="M48 62 Q60 74 72 62" stroke="#7dff9a" stroke-width="4" fill="none" stroke-linecap="round"/>
<path class="face-a" d="M48 68 Q60 58 72 68" stroke="#ff4b4b" stroke-width="4" fill="none" stroke-linecap="round"/>
<g class="steam"><circle cx="16" cy="30" r="7"/><circle cx="104" cy="30" r="7"/><circle cx="24" cy="14" r="5"/><circle cx="96" cy="14" r="5"/></g>
      </svg>
      <div>
        <div class="muted" id="doneTitle" style="font-weight:800"></div>
        <div class="big" id="doneScore"></div>
        <div class="msg" id="doneMsg"></div>
        <div class="btns">
          <button id="btnAgain" class="btn">Пройти ещё раз</button>
          <button id="btnList" class="btn sec">К списку тестов</button>
        </div>
      </div>
    </div>
    <div id="doneList"></div>
  </div>

  <footer>
    <b>Бип-бип!</b> Школа робота Бипа · Уроки и тесты для 6–10 классов
  </footer>

</div>

<script>
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- плавающие символы кода ---------- */
const GLYPHS = ["[]","{}","\"\"","==","+","*","for","print()","len()","%","if","()","=","->","::","split()","append()"];
if (!reduceMotion) {
  for (let i = 0; i < 14; i++) {
    const s = document.createElement("span");
    s.className = "g";
    s.textContent = GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
    s.style.left = Math.random() * 94 + "vw";
    s.style.fontSize = 18 + Math.random() * 30 + "px";
    s.style.animationDuration = 16 + Math.random() * 18 + "s";
    s.style.animationDelay = -Math.random() * 24 + "s";
    document.body.appendChild(s);
  }
}

/* ---------- речь Бипа (печатание) ---------- */
const PHRASES = ["Привет! Я Бип!", "Проверим, что ты знаешь?", "Выбери класс и тему!", "Ошибаться не страшно!", "Каждый раз вопросы новые!"];
const sayEl = document.getElementById("say");
if (reduceMotion) {
  sayEl.textContent = PHRASES[0];
} else {
  let pi = 0, ci = 0, deleting = false;
  (function type() {
    const phrase = PHRASES[pi];
    sayEl.textContent = phrase.slice(0, ci);
    let delay = deleting ? 32 : 62;
    if (!deleting && ci === phrase.length) { delay = 1900; deleting = true; }
    else if (deleting && ci === 0) { deleting = false; pi = (pi + 1) % PHRASES.length; delay = 420; }
    else ci += deleting ? -1 : 1;
    setTimeout(type, delay);
  })();
}

/*CORE*/
function norm(s) { return String(s == null ? '' : s).trim().toLowerCase().replace(/ё/g, 'е').replace(/\s+/g, ' '); }
function canon(s) {
  s = norm(s).replace(/,/g, '.');
  const m = /^([+-]?)(\d+)(?:\.(\d+))?$/.exec(s);
  if (m) { const ip = m[2].replace(/^0+/, '') || '0', fp = (m[3] || '').replace(/0+$/, ''); s = (m[1] === '-' && (ip !== '0' || fp) ? '-' : '') + ip + (fp ? '.' + fp : ''); }
  return s;
}
function sha256Fallback(msg) {
  const rr = (v, a) => (v >>> a) | (v << (32 - a));
  const K = [], H = []; let n = 0;
  for (let c = 2; n < 64; c++) { let p = true; for (let d = 2; d * d <= c; d++) if (c % d === 0) { p = false; break; }
    if (p) { if (n < 8) H[n] = (Math.pow(c, 0.5) % 1 * 4294967296) | 0; K[n++] = (Math.pow(c, 1 / 3) % 1 * 4294967296) | 0; } }
  const l = msg.length, words = [];
  const bytes = Array.from(msg); bytes.push(0x80);
  while (bytes.length % 64 !== 56) bytes.push(0);
  const hi = Math.floor(l * 8 / 4294967296), lo = (l * 8) >>> 0;
  bytes.push((hi >>> 24) & 255, (hi >>> 16) & 255, (hi >>> 8) & 255, hi & 255, (lo >>> 24) & 255, (lo >>> 16) & 255, (lo >>> 8) & 255, lo & 255);
  for (let i = 0; i < bytes.length; i += 4) words.push((bytes[i] << 24) | (bytes[i + 1] << 16) | (bytes[i + 2] << 8) | bytes[i + 3]);
  let h = H.slice();
  for (let j = 0; j < words.length; j += 16) {
    const w = words.slice(j, j + 16);
    for (let i = 16; i < 64; i++) {
      const s0 = rr(w[i - 15], 7) ^ rr(w[i - 15], 18) ^ (w[i - 15] >>> 3), s1 = rr(w[i - 2], 17) ^ rr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
    }
    let [a, b, c, d, e, f, g, hh] = h;
    for (let i = 0; i < 64; i++) {
      const S1 = rr(e, 6) ^ rr(e, 11) ^ rr(e, 25), ch = (e & f) ^ (~e & g), t1 = (hh + S1 + ch + K[i] + w[i]) | 0;
      const S0 = rr(a, 2) ^ rr(a, 13) ^ rr(a, 22), mj = (a & b) ^ (a & c) ^ (b & c), t2 = (S0 + mj) | 0;
      hh = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    h = [h[0] + a, h[1] + b, h[2] + c, h[3] + d, h[4] + e, h[5] + f, h[6] + g, h[7] + hh].map(x => x | 0);
  }
  return h.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}
async function sha256hex(str) {
  const bytes = new TextEncoder().encode(str);
  if (typeof crypto !== 'undefined' && crypto.subtle) {
    const d = await crypto.subtle.digest('SHA-256', bytes);
    return Array.from(new Uint8Array(d)).map(b => b.toString(16).padStart(2, '0')).join('');
  }
  return sha256Fallback(bytes);
}
async function isRight(tid, q, ans) {
  let key;
  if (q.type === 'input') { if (!norm(ans)) return false; key = canon(ans); }
  else if (q.type === 'single') { if (!ans) return false; key = canon(ans); }
  else if (q.type === 'multi') { if (!Array.isArray(ans) || !ans.length) return false; key = ans.map(canon).sort().join('\n'); }
  else {
    if (!ans || !q.left.every(l => ans[l])) return false;
    key = q.left.map(l => canon(l) + '=' + canon(ans[l])).sort().join('\n');
  }
  return q.h.includes(await sha256hex(tid + ':' + q.id + ':' + key));
}
function fmtGiven(q, a) {
  if (q.type === 'multi') return (a || []).join('; ');
  if (q.type === 'match') return q.left.filter(l => a && a[l]).map(l => l + ' → ' + a[l]).join('; ');
  return String(a || '').trim();
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function makePaper(test, n) {
  return shuffle(test.questions).slice(0, n).map(q => {
    const it = Object.assign({}, q);
    if (it.options) it.options = shuffle(it.options);
    if (it.type === 'match') { it.left = shuffle(it.left); it.right = shuffle(it.right); }
    return it;
  });
}
/*ENDCORE*/

const $ = s => document.querySelector(s);
const S = { test:null, paper:[], answers:{}, finished:false };
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function show(id) { for (const s of ['#screenList', '#screenTest', '#screenDone']) $(s).classList.toggle('hidden', s !== id); window.scrollTo(0, 0); }
const ARROW = '<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

/* ───── список тестов по классам ───── */
let DATA = null, curCls = null;
async function loadList() {
  try {
    const r = await fetch('tests.json?v=' + Date.now()); if (!r.ok) throw 0;
    DATA = await r.json();
  } catch (e) { $('#listErr').textContent = 'Не удалось загрузить тесты. Обновите страницу.'; return; }
  const set = new Set(); let other = false;
  DATA.tests.forEach(t => { if (t.classes.length) t.classes.forEach(c => set.add(String(c))); else other = true; });
  const groups = [...set].sort((a, b) => a - b); if (other) groups.push('other');
  if (!groups.length) { $('#tests').textContent = 'Тестов пока нет.'; return; }
  if (!groups.includes(curCls)) curCls = groups[0];
  renderChips(groups); renderTests();
}
function renderChips(groups) {
  const box = $('#chips'); box.innerHTML = '';
  groups.forEach(g => {
    const b = el('button', 'chip' + (g === curCls ? ' on' : ''), g === 'other' ? 'Другие' : g + ' класс');
    b.onclick = () => { curCls = g; renderChips(groups); renderTests(); };
    box.appendChild(b);
  });
}
function shortTitle(t) {
  // убираем из заголовка «Информатика. 6 класс. » — предмет и класс уже видны на карточке
  const s = String(t.title);
  const m = /^[^.]{1,40}\.\s*\d+\s*класс\.\s*(.+)$/i.exec(s);
  return m ? m[1] : s;
}
function renderTests() {
  const box = $('#tests'); box.innerHTML = '';
  DATA.tests.filter(t => curCls === 'other' ? !t.classes.length : t.classes.map(String).includes(curCls))
    .sort((a, b) => a.title.localeCompare(b.title, 'ru')).forEach(t => {
      const n = Math.min(DATA.per_test, t.questions.length);
      const key = curCls === 'other' ? 'x' : curCls;
      const b = el('button', 'card tcard c' + key);
      b.appendChild(el('span', 'num', curCls === 'other' ? '?' : curCls));
      b.appendChild(el('h3', '', shortTitle(t)));
      b.appendChild(el('span', 'who', (t.subject ? t.subject + ' · ' : '') + 'вопросов: ' + n));
      const go = el('span', 'go', 'Начать тест '); go.insertAdjacentHTML('beforeend', ARROW);
      b.appendChild(go);
      b.onclick = () => begin(t);
      box.appendChild(b);
    });
}

/* ───── тест ───── */
function begin(t) {
  S.test = t; S.paper = makePaper(t, Math.min(DATA.per_test, t.questions.length)); S.answers = {}; S.finished = false;
  $('#testTitle').textContent = t.title;
  $('#barTitle').textContent = shortTitle(t);
  $('#testInfo').textContent = 'Вопросов: ' + S.paper.length + '. Ответь на все вопросы и нажми «Завершить и проверить».';
  renderTest(); updateProgress(); show('#screenTest');
}
function renderTest() {
  const box = $('#questions'); box.innerHTML = '';
  S.paper.forEach((q, i) => {
    const wrap = el('div', 'q');
    const head = el('div', 'qhead');
    head.appendChild(el('span', 'qn', String(i + 1)));
    head.appendChild(el('div', 'qt', q.text));
    wrap.appendChild(head);
    if (q.image) { const im = el('img', 'qimg'); im.src = q.image; im.alt = ''; wrap.appendChild(im); }
    const saved = S.answers[q.id];
    if (q.type === 'input') {
      const inp = el('input'); inp.type = 'text'; inp.autocomplete = 'off'; inp.placeholder = 'Твой ответ';
      if (typeof saved === 'string') inp.value = saved;
      inp.oninput = () => setAns(q.id, inp.value);
      wrap.appendChild(inp);
    } else if (q.type === 'single' || q.type === 'multi') {
      const multi = q.type === 'multi';
      if (multi) wrap.appendChild(el('div', 'hint', 'Можно выбрать несколько вариантов'));
      q.options.forEach(o => {
        const lab = el('label', 'opt');
        const inp = el('input'); inp.type = multi ? 'checkbox' : 'radio'; inp.name = 'q_' + q.id; inp.value = o;
        inp.checked = multi ? (Array.isArray(saved) && saved.includes(o)) : saved === o;
        inp.onchange = () => {
          if (multi) setAns(q.id, [...wrap.querySelectorAll('input:checked')].map(x => x.value));
          else setAns(q.id, o);
        };
        lab.appendChild(inp); lab.appendChild(el('span', '', o)); wrap.appendChild(lab);
      });
    } else if (q.type === 'match') {
      wrap.appendChild(el('div', 'hint', 'Выбери пару для каждого пункта'));
      const cur = (saved && typeof saved === 'object') ? saved : {};
      q.left.forEach(l => {
        const row = el('div', 'mrow'); row.appendChild(el('div', 'l', l));
        const sel = el('select'); const o0 = el('option', '', '— выберите —'); o0.value = ''; sel.appendChild(o0);
        q.right.forEach(r => { const o = el('option', '', r); o.value = r; sel.appendChild(o); });
        sel.value = cur[l] || '';
        sel.onchange = () => { const a = Object.assign({}, S.answers[q.id] || {}); a[l] = sel.value; setAns(q.id, a); };
        row.appendChild(sel); wrap.appendChild(row);
      });
    }
    box.appendChild(wrap);
  });
}

function setAns(id, v) { S.answers[id] = v; updateProgress(); }
function isAnswered(q) {
  const a = S.answers[q.id];
  if (q.type === 'input') return typeof a === 'string' && a.trim() !== '';
  if (q.type === 'single') return !!a;
  if (q.type === 'multi') return Array.isArray(a) && a.length > 0;
  if (q.type === 'match') return !!a && q.left.every(l => a[l]);
  return false;
}
function updateProgress() {
  const total = S.paper.length, done = S.paper.filter(isAnswered).length;
  $('#barCnt').textContent = 'Отвечено: ' + done + ' из ' + total;
  $('#barFill').style.width = (total ? done / total * 100 : 0) + '%';
}

/* ───── проверка и результат ───── */
$('#btnSubmit').onclick = async () => {
  const missing = S.paper.filter(q => !isAnswered(q)).length;
  if (missing && !confirm('Без ответа осталось вопросов: ' + missing + '. Всё равно завершить?')) return;
  $('#btnSubmit').disabled = true;
  const items = [];
  for (let i = 0; i < S.paper.length; i++) {
    const q = S.paper[i], a = S.answers[q.id];
    items.push({ n:i + 1, q:q.text, image:q.image, given:fmtGiven(q, a), ok:await isRight(S.test.id, q, a) });
  }
  S.finished = true; $('#btnSubmit').disabled = false; showResult(items);
};
function showResult(items) {
  const ok = items.filter(x => x.ok).length, ratio = items.length ? ok / items.length : 0;
  $('#doneTitle').textContent = S.test.title;
  $('#doneScore').textContent = 'Верно: ' + ok + ' из ' + items.length;
  const robot = $('#doneRobot'); robot.classList.remove('happy', 'sad');
  let msg;
  if (ratio >= 0.8) { robot.classList.add('happy'); msg = 'Бип-бип! Отличный результат!'; }
  else if (ratio >= 0.5) { msg = 'Неплохо! Посмотри ошибки и попробуй ещё раз.'; }
  else { robot.classList.add('sad'); msg = 'Ничего страшного! Повтори тему и попробуй снова.'; }
  $('#doneMsg').textContent = msg;
  const box = $('#doneList'); box.innerHTML = '';
  items.forEach(it => {
    const r = el('div', 'res ' + (it.ok ? 'ok' : 'bad'));
    r.appendChild(el('div', 'badge', (it.ok ? '✓ Верно' : '✗ Неверно') + ' — вопрос ' + it.n));
    r.appendChild(el('div', 'qt', it.q));
    if (it.image) { const im = el('img', 'qimg'); im.src = it.image; im.alt = ''; r.appendChild(im); }
    r.appendChild(el('div', 'muted', 'Твой ответ: ' + (it.given || '— нет ответа —')));
    box.appendChild(r);
  });
  show('#screenDone');
}
$('#btnAgain').onclick = () => begin(S.test);
$('#btnList').onclick = $('#btnBack').onclick = () => {
  if (!S.finished && !$('#screenTest').classList.contains('hidden') && !confirm('Текущая попытка будет потеряна. Выйти?')) return;
  show('#screenList'); loadList();
};
window.addEventListener('beforeunload', e => { if (!S.finished && !$('#screenTest').classList.contains('hidden')) { e.preventDefault(); e.returnValue = ''; } });
loadList();
</script>
</body>
