<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff7e6">
<script>
(function(){var t;try{t=localStorage.getItem('bip-theme')}catch(e){}
if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
document.documentElement.setAttribute('data-theme',t);})();
</script>
<title>Бип учит строки — тест</title>
<style>
:root{--bg:#fff7e6;--card:#ffffff;--text:#23283a;--muted:#6b7089;--accent:#ff7a1a;--accent-t:#ffffff;--line:#f0dfbf;--good:#1f9d55;--bad:#e03a3a;--code:#1d2233;--code-t:#e9ecff;--glow:#ffd99a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark;--bg:#151829;--card:#1f2340;--text:#eef0fa;--muted:#a4aacb;--line:#363c63;--good:#3ddc84;--bad:#ff6b6b;--code:#0e1120;--glow:#3a3320}
.theme-anim,.theme-anim *{transition:background-color .35s ease,border-color .35s ease,color .35s ease!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;font-size:17px;line-height:1.5;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:640px;margin:0 auto;padding:16px}
h1,h2{font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;margin:0;line-height:1.15}
button{font:inherit;cursor:pointer;border:0;border-radius:14px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-t);font-weight:800;padding:13px 20px;width:100%;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.good{background:var(--good)}
.ghost{background:transparent;color:var(--muted);padding:8px 10px;font-weight:700}
.ghost:disabled{opacity:.35;cursor:not-allowed}
.navbtn{width:42px;height:42px;flex:none;border-radius:50%;background:var(--accent);color:var(--accent-t);font-size:24px;font-weight:800;line-height:1;display:grid;place-items:center;padding:0;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.navbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.navbtn:disabled{opacity:.35;cursor:not-allowed}
.home-btn{margin-left:auto;align-self:flex-start;display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 16px 0 12px;border-radius:16px;white-space:nowrap;background:var(--card);border:2px solid var(--line);color:var(--text);font-weight:800;font-size:.95rem;text-decoration:none;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.08);transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease}
.home-btn svg{width:22px;height:22px;flex:none;stroke:var(--accent);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.home-btn .arr{margin-right:-2px;transition:transform .25s ease}
.home-btn:hover,.home-btn:focus-visible{border-color:var(--accent);transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.08);outline:none}
.home-btn:hover .arr,.home-btn:focus-visible .arr{transform:translateX(-5px)}
.home-btn .house{transition:transform .25s ease}
.home-btn:hover .house{transform:rotate(-8deg) scale(1.1)}
.theme-btn{flex:none;width:46px;height:46px;border-radius:16px;cursor:pointer;display:grid;place-items:center;padding:0;background:var(--card);border:2px solid var(--line);color:var(--text);box-shadow:0 4px 0 rgba(0,0,0,.08);transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease}
.theme-btn:hover{border-color:var(--accent);transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.08)}
.theme-btn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.theme-btn .sun{display:none}
:root[data-theme="dark"] .theme-btn .sun{display:block}
:root[data-theme="dark"] .theme-btn .moon{display:none}
@media (max-width:480px){.home-btn{padding:0 12px}.home-btn span{display:none}}
/* ---------- оверлей перехода ---------- */
.ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(255,247,230,.97);backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:opacity .3s ease,visibility .3s ease}
:root[data-theme="dark"] .ov{background:rgba(21,24,41,.97)}
.ov.show{opacity:1;visibility:visible}
.ov-box{text-align:center;transform:scale(.94);transition:transform .3s ease}
.ov.show .ov-box{transform:scale(1)}
.ov .robot{width:130px;height:152px;margin:0 auto;animation:ovJump .45s ease-in-out infinite alternate}
@keyframes ovJump{to{transform:translateY(-16px) rotate(3deg)}}
.ov-name{font-family:"Fredoka",system-ui,sans-serif;font-size:clamp(1.4rem,4vw,2rem);margin:16px 0 18px}
.ov-bar{width:min(340px,72vw);height:10px;margin:0 auto 14px;border-radius:999px;background:var(--line);overflow:hidden}
.ov-bar span{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--accent),#ffb020);transition:width .05s linear}
.ov-status{color:var(--muted);font-weight:700;font-size:.95rem}
.hide{display:none!important}

/* robot */
.robot{width:120px;height:140px;flex:none;transform-origin:50% 100%}
.robot svg{width:100%;height:100%;overflow:visible}
.robot .face-s,.robot .face-a,.robot .brow{display:none}
.robot .eye{fill:#5ee0ff;transition:fill .2s}
.robot .ball{fill:#ffb020}
.robot .armL,.robot .armR{transform-box:fill-box;transform-origin:50% 10%;transition:transform .3s}
.robot.talk .face-n{animation:talk .22s infinite alternate}
@keyframes talk{to{transform:scaleY(2.2)}}
.face-n{transform-box:fill-box;transform-origin:center}
.robot.happy{animation:jump .5s 3}
.robot.happy .eye{fill:#7dff9a}
.robot.happy .face-n,.robot.angry .face-n{display:none}
.robot.happy .face-s{display:block}
.robot.happy .armL{transform:rotate(150deg)}
.robot.happy .armR{transform:rotate(-150deg)}
@keyframes jump{50%{transform:translateY(-22px) rotate(4deg)}}
.robot.angry{animation:shake .12s 8}
.robot.angry .eye{fill:#ff4b4b}
.robot.angry .ball{fill:#ff3030}
.robot.angry .face-a,.robot.angry .brow{display:block}
.robot.angry .armL{transform:rotate(-40deg)}
.robot.angry .armR{transform:rotate(40deg)}
@keyframes shake{25%{transform:translateX(-6px) rotate(-2deg)}75%{transform:translateX(6px) rotate(2deg)}}
.robot.idle{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.robot,.robot *{animation:none!important}}

.robot .steam{display:none;fill:#fff;opacity:.85}
.robot.angry.a1{animation:shake .12s 2}
.robot.angry.a1 .eye{fill:#ffb020}
.robot.angry.a1 .face-a{display:none}
.robot.angry.a1 .face-n{display:block}
.robot.angry.a2{animation:shake .12s 8}
.robot.angry.a3{animation:shake .1s 16}
.robot.angry.a3 .steam,.robot.angry.a4 .steam{display:block;animation:puff .8s infinite}
@keyframes puff{from{transform:translateY(6px);opacity:.9}to{transform:translateY(-24px);opacity:0}}
.robot.angry.a4{animation:rage .09s infinite;filter:drop-shadow(0 0 14px #ff3030)}
@keyframes rage{25%{transform:translateX(-8px) rotate(-3deg) scale(1.08)}75%{transform:translateX(8px) rotate(3deg) scale(1.08)}}
.robot.angry.a4 .ball{animation:blink .3s infinite}
@keyframes blink{50%{fill:#fff}}
.robot.angry.a4 .armL{animation:flailL .2s infinite alternate}
.robot.angry.a4 .armR{animation:flailR .2s infinite alternate}
@keyframes flailL{from{transform:rotate(-100deg)}to{transform:rotate(-10deg)}}
@keyframes flailR{from{transform:rotate(100deg)}to{transform:rotate(10deg)}}
.bubble{white-space:pre-wrap}
.meter{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);font-weight:700;margin:-22px 0 14px}
.meter div{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb020,#ff3030);transition:width .4s}
.notes{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.notes li{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 12px}
.notes code{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--glow);padding:1px 6px;border-radius:6px;font-weight:700}
.res h2{text-align:center;font-size:26px;margin-bottom:6px}
.big{font-size:18px;text-align:center}
.big b{font-size:44px;font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;display:block;line-height:1.1}
.gauge{position:relative;height:14px;border-radius:8px;margin:12px 6px 18px;background:linear-gradient(90deg,#1f9d55,#ffb020,#ff3030)}
.gauge i{position:absolute;top:-5px;width:6px;height:24px;background:var(--text);border-radius:3px;transform:translateX(-50%);transition:left .8s}
.gl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:-12px 6px 14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips span{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:4px 10px;font-weight:700}
.tbl{display:grid;gap:4px}
.tbl div{display:flex;gap:10px;padding:6px 10px;border-radius:10px;border:2px solid transparent;font-size:15px}
.tbl div.me{border-color:var(--accent);background:var(--glow);font-weight:800}
.tbl span:first-child{min-width:52px}
/* menu */
.hero{display:flex;align-items:center;gap:8px;margin:8px 0 18px}
.hero h1{font-size:30px}
.hero p{margin:6px 0 0;color:var(--muted)}
.cats{display:grid;gap:12px;list-style:none;padding:0;margin:0}
.cat{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);color:var(--text);padding:14px 16px;border:2px solid var(--line);border-radius:18px}
.cat .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--glow);flex:none;font-family:"Fredoka",system-ui,sans-serif;font-weight:700}
.cat b{display:block;font-size:18px}
.cat small{color:var(--muted)}
.cat.open{border-color:var(--accent);box-shadow:0 4px 0 var(--accent)}
.cat.locked{opacity:.55;cursor:not-allowed}
.cat .st{margin-left:auto;font-size:22px}

/* lesson */
.top{display:flex;align-items:center;gap:6px}
.dots{display:flex;gap:5px;flex:1;justify-content:center}
.dots i{height:8px;flex:1;max-width:28px;border-radius:5px;background:var(--line)}
.dots i.on{background:var(--accent)}
.dots i.now{background:var(--good)}
.scene{display:flex;align-items:flex-end;gap:6px;margin:10px 0 14px}
.bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;flex:1;min-height:84px;margin-bottom:34px;overflow-wrap:anywhere}
.bubble::before{content:"";position:absolute;left:-10px;bottom:18px;border:8px solid transparent;border-right:10px solid var(--line);border-left:0}
.bubble.bad{border-color:var(--bad)}
.bubble.ok{border-color:var(--good)}
.bubble.bad::before{border-right-color:var(--bad)}
.bubble.ok::before{border-right-color:var(--good)}
pre{margin:0;font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:16px;white-space:pre-wrap;word-break:break-word}
.code{background:var(--code);color:var(--code-t);border-radius:14px;padding:12px 14px}
.out{background:#000;color:#8dffb0;border-radius:14px;padding:10px 14px;margin-top:8px;min-height:44px}
.out.err{color:#ff9a9a}
.lab{font-size:14px;color:var(--muted);font-weight:700;margin:12px 0 4px}
.task{background:var(--glow);border-radius:14px;padding:12px 14px;font-weight:700;margin-bottom:10px;overflow-wrap:anywhere}
.cat small.pr{display:block;margin-top:3px;font-weight:700}.bar{display:block;height:6px;border-radius:3px;background:var(--line);margin-top:5px;overflow:hidden}.bar b{display:block;height:100%;background:#2ecc71;border-radius:3px}
.keys{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.keys button{background:var(--card);color:var(--text);border:2px solid var(--line);padding:6px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700}
textarea{width:100%;min-height:110px;resize:vertical;background:var(--code);color:var(--code-t);border:2px solid transparent;border-radius:14px;padding:12px 14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px;line-height:1.5}
textarea:focus{border-color:var(--accent);outline:0}
.row{display:grid;gap:10px;margin-top:12px}
.stars{font-size:44px;text-align:center;margin:8px 0}
</style>
</head>
<body>
<main>
<section id="menu">
  <div class="hero">
    <div class="robot idle" id="r0"></div>
    <div><h1>Бип учит строки</h1><p>Строка — это текст. Начнём с азов и будем усложнять!</p><p style="color:var(--accent);font-weight:800">Тестовый режим: стрелки ‹ › листают задания без прохождения.</p></div>
    <a class="home-btn" href="index.html" data-home title="К выбору курса">
      <svg class="arr" viewBox="0 0 24 24"><path d="M19 12H6M11 6l-6 6 6 6"/></svg>
      <svg class="house" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5M5.5 10v10h4.5v-5.5h4V20h4.5V10"/></svg>
      <span>Выбор курса</span>
    </a>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Переключить тему" title="Светлая / тёмная тема">
      <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
  <ul class="cats" id="cats"></ul>
</section>

<section id="lesson" class="hide">
  <div class="top"><button class="ghost" id="back" aria-label="В меню">‹ Меню</button><button class="navbtn" id="prev" aria-label="Назад" title="Назад">‹</button><div class="dots" id="dots"></div><button class="navbtn" id="fwd" aria-label="Вперёд" title="Вперёд">›</button></div>
  <div class="scene"><div class="robot idle" id="r1"></div><div class="bubble" id="bubble"></div></div>
  <div class="meter"><span id="mlab">Бип спокоен</span><div><i id="mfill"></i></div></div>
  <div id="panel"></div>
</section>
</main>

<!-- оверлей перехода -->
<div class="ov" id="ov" aria-hidden="true">
  <div class="ov-box">
    <div class="robot" id="ovRobot"></div>
    <div class="ov-name" id="ovName">—</div>
    <div class="ov-bar"><span id="ovFill"></span></div>
    <div class="ov-status" id="ovStatus">Бип подключается…</div>
  </div>
</div>

<script>
const ROBOT=`<svg viewBox="0 0 120 140" aria-hidden="true">
<line x1="60" y1="8" x2="60" y2="26" stroke="#8a93b8" stroke-width="4"/><circle class="ball" cx="60" cy="8" r="7"/>
<g class="armL"><rect x="6" y="84" width="14" height="38" rx="7" fill="#8a93b8"/></g>
<g class="armR"><rect x="100" y="84" width="14" height="38" rx="7" fill="#8a93b8"/></g>
<rect x="26" y="80" width="68" height="50" rx="12" fill="#c9d0ee"/><rect x="44" y="94" width="32" height="20" rx="6" fill="#ff7a1a"/>
<rect x="18" y="24" width="84" height="60" rx="18" fill="#dfe4f7" stroke="#8a93b8" stroke-width="3"/>
<rect x="28" y="36" width="64" height="36" rx="12" fill="#1d2233"/>
<circle class="eye" cx="46" cy="52" r="8"/><circle class="eye" cx="74" cy="52" r="8"/>
<path class="brow" d="M36 38 L54 46 M84 38 L66 46" stroke="#ff4b4b" stroke-width="4" stroke-linecap="round"/>
<rect class="face-n" x="50" y="62" width="20" height="3" rx="1.5" fill="#5ee0ff"/>
<path class="face-s" d="M48 62 Q60 74 72 62" stroke="#7dff9a" stroke-width="4" fill="none" stroke-linecap="round"/>
<path class="face-a" d="M48 68 Q60 58 72 68" stroke="#ff4b4b" stroke-width="4" fill="none" stroke-linecap="round"/>
<g class="steam"><circle cx="16" cy="30" r="7"/><circle cx="104" cy="30" r="7"/><circle cx="24" cy="14" r="5"/><circle cx="96" cy="14" r="5"/></g></svg>`;
document.querySelectorAll('.robot').forEach(r=>r.innerHTML=ROBOT);
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- мини-Python: print, input, type, int, float, + - * / ---------- */
class Fl{constructor(n){this.n=n}}
const isF=x=>x instanceof Fl,num=x=>isF(x)?x.n:x;
const truthy=x=>Array.isArray(x)?x.length>0:typeof x==='string'?x!=='':isF(x)?x.n!==0:!!x;
const fmt=x=>Array.isArray(x)?'['+x.map(q=>typeof q==='string'?"'"+q+"'":fmt(q)).join(', ')+']':typeof x==='string'?x:typeof x==='boolean'?(x?'True':'False'):isF(x)?(Number.isInteger(x.n)?x.n.toFixed(1):String(x.n)):String(x);
function splitTop(s,ch){const r=[];let d=0,q=null,cur='';for(const c of s){if(q){cur+=c;if(c===q)q=null;continue}
 if(c==='"'||c==="'"){q=c;cur+=c;continue}if(c==='('||c==='[')d++;if(c===')'||c===']')d--;
 if(c===ch&&d===0){r.push(cur);cur='';continue}cur+=c}r.push(cur);return r}
function call(f,a,b){if(f==='len'){if(typeof a!=='string'&&!Array.isArray(a))throw Error('len считает символы в тексте.');return a.length}if(f==='str')return fmt(a);
 if(f==='round'||f==='abs'){if(typeof a==='string')throw Error('С текстом так считать нельзя.');
  if(f==='abs')return isF(a)?new Fl(Math.abs(a.n)):Math.abs(a);
  const x=num(a);if(b===undefined){let r=Math.round(x);if(Math.abs(x%1)===0.5&&r%2!==0)r--;return r}
  const p=10**b;return new Fl(Math.round(x*p)/p)}
 if(f==='type')return `<class '${Array.isArray(a)?'list':typeof a==='string'?'str':typeof a==='boolean'?'bool':isF(a)?'float':'int'}'>`;
 if(f==='int'){if(typeof a==='string'){if(/^\s*-?\d+\s*$/.test(a))return Number(a);throw Error(`Не получается превратить «${a}» в целое число. Для дробных нужен float.`)}return isF(a)?Math.trunc(a.n):a}
 if(typeof a==='string'){if(/^\s*-?\d+(\.\d+)?\s*$/.test(a))return new Fl(Number(a));throw Error(`Не получается превратить «${a}» в число. Дробь пишется через точку.`)}
 return new Fl(num(a))}
function bin(o,a,b){
 if(typeof a==='string'||typeof b==='string'){if(o==='+'&&typeof a==='string'&&typeof b==='string')return a+b;if(o==='*'&&typeof a==='string'&&typeof b==='number')return a.repeat(Math.max(0,b));if(o==='*'&&typeof b==='string'&&typeof a==='number')return b.repeat(Math.max(0,a));throw Error(o==='+'?'Нельзя складывать текст и число. Число в текст превращает str(), а ещё есть f-строки.':'С текстом так считать нельзя.')}
 const f=isF(a)||isF(b),x=num(a),y=num(b);let r;
 if((o==='/'||o==='//'||o==='%')&&y===0)throw Error('На ноль делить нельзя!');
 if(o==='+')r=x+y;else if(o==='-')r=x-y;else if(o==='*')r=x*y;else if(o==='/')return new Fl(x/y);else if(o==='//')r=Math.floor(x/y);else if(o==='%')r=((x%y)+y)%y;else{r=x**y;if(!(f||y<0))return r;return new Fl(r)}
 return f?new Fl(r):r}
const dec=q=>q.replace(/\\(.)/g,(a,c)=>({n:'\n',t:'\t','\\':'\\','"':'"',"'":"'"}[c]??a));
const M={upper:q=>q.toUpperCase(),lower:q=>q.toLowerCase(),capitalize:q=>q.charAt(0).toUpperCase()+q.slice(1).toLowerCase(),
title:q=>q.toLowerCase().replace(/(^|[^A-Za-zА-Яа-яЁё])([A-Za-zА-Яа-яЁё])/g,(m,a,b)=>a+b.toUpperCase()),strip:q=>q.trim(),lstrip:q=>q.trimStart(),rstrip:q=>q.trimEnd(),

function expr(e,v,io){
 const T=e.match(/f"(?:\\.|[^"\\])*"|f'(?:\\.|[^'\\])*'|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\d+\.\d+|\d+|[A-Za-zА-Яа-яЁё_][\wА-Яа-яЁё]*|\*\*|\/\/|==|!=|<=|>=|\S/g)||[];let i=0;
 const nx=()=>T[i++],bad=()=>Error(`Не понимаю «${e.trim()}». Текст пишется в кавычках, числа — без них.`);
 function atom(){const t=nx();let m;if(t===undefined)throw bad();
  if(t==='('){const x=orx();if(nx()!==')')throw bad();return x}
  if(t==='-'){const x=atom();if(typeof x==='string')throw Error('Минус не работает с текстом.');return isF(x)?new Fl(-x.n):-x}
  if(t==='['){const r=[];if(T[i]===']'){i++;return r}for(;;){r.push(orx());if(T[i]===','){i++;continue}if(nx()!==']')throw bad();return r}}
  if((m=t.match(/^f(["'])([\s\S]*)\1$/)))return dec(m[2]).replace(/\{([^{}]*)\}/g,(_,q)=>fmt(expr(q,v,io)));
  if((m=t.match(/^(?:"([\s\S]*)"|'([\s\S]*)')$/)))return dec(m[1]??m[2]);
  if(t==='True')return true;if(t==='False')return false;
  if(/^\d+$/.test(t))return Number(t);
  if(/^\d+\.\d+$/.test(t))return new Fl(Number(t));
  if(/^[A-Za-zА-Яа-яЁё_]/.test(t)){
   if(T[i]==='('){i++;
    if(t==='input'){const p=T[i]===')'?'':fmt(add());if(nx()!==')')throw bad();const val=io.inp[io.k++]??'';io.out+=p+val+'\n';return val}
    if(['int','float','type','round','abs','len','str'].includes(t)){const a=orx();let b;if(T[i]===','){i++;b=num(add())}if(nx()!==')')throw bad();return call(t,a,b)}
    throw Error(`Я не знаю команды «${t}». Я знаю print, input, type, int, float, round, abs, len и str.`)}
   if(t in v)return v[t];throw Error(`Я не знаю слова «${t}». Если это текст — возьми его в кавычки.`)}
  throw bad()}
 function post(x){for(;;){
 if(T[i]==='['){i++;let a,b,c,sl=0;if(T[i]!==':')a=orx();if(T[i]===':'){sl=1;i++;if(T[i]!==':'&&T[i]!==']')b=orx();if(T[i]===':'){i++;if(T[i]!==']')c=orx()}}if(nx()!==']')throw bad();x=idx(x,a,b,c,sl)}
 else if(T[i]==='.'&&/^[A-Za-z_]/.test(T[i+1]||'')&&T[i+2]==='('){const nm=T[i+1];i+=3;const ar=[];if(T[i]!==')')for(;;){ar.push(orx());if(T[i]===','){i++;continue}break}if(nx()!==')')throw bad();x=meth(x,nm,ar)}
 else return x}}
 function pw(){let a=post(atom());if(T[i]==='**'){i++;a=bin('**',a,pw())}return a}
 function mul(){let a=pw();while(T[i]==='*'||T[i]==='/'||T[i]==='//'||T[i]==='%'){const o=nx();a=bin(o,a,pw())}return a}
 function add(){let a=mul();while(T[i]==='+'||T[i]==='-'){const o=nx();a=bin(o,a,mul())}return a}
 function rel(o,a,b){const sa=typeof a==='string',sb=typeof b==='string';
  if(sa!==sb){if(o==='==')return false;if(o==='!=')return true;throw Error('Текст и число нельзя сравнивать на больше-меньше. Может, забыл int() или float()?')}
  const x=sa?a:num(a),y=sb?b:num(b);return o==='=='?x===y:o==='!='?x!==y:o==='<'?x<y:o==='>'?x>y:o==='<='?x<=y:x>=y}
 function cmp(){const a=add();let o=T[i],ng=0;if(o==='not'&&T[i+1]==='in'){ng=1;i++;o='in'}if(o==='in'){i++;const b=add();if(!(typeof b==='string'?typeof a==='string':Array.isArray(b)))throw Error('«in» ищет текст внутри текста.');const r=b.includes(a);return ng?!r:r}if(['==','!=','<','>','<=','>='].includes(o)){i++;return rel(o,a,add())}return a}
 function nt(){if(T[i]==='not'){i++;return !truthy(nt())}return cmp()}
 function an(){let a=nt();while(T[i]==='and'){i++;const b=nt();a=truthy(a)&&truthy(b)}return a}
 function orx(){let a=an();while(T[i]==='or'){i++;const b=an();a=truthy(a)||truthy(b)}return a}
 const r=orx();if(T[i]==='=')throw Error('Один знак = кладёт значение в коробочку. Для сравнения нужно два знака: ==');if(i<T.length)throw bad();return r}
function run(code,inputs){
 code=code.replace(/[“”„«»]/g,'"').replace(/[‘’]/g,"'");
 const v={},io={out:'',k:0,inp:inputs};
 const L=code.split('\n').map((raw,n)=>({n:n+1,ind:raw.match(/^ */)[0].length,t:raw.trim()})).filter(x=>x.t&&x.t[0]!=='#');let p=0;
 function stmt(l){const n=l.n,t=l.t;let m;const at=x=>Error(`Строка ${n}: ${x}`);
  try{
   if((m=t.match(/^print\((.*)\)$/))){
    let sep=' ',end='\n';const args=[];
    if(m[1].trim()!==''){for(const a of splitTop(m[1],',')){let kw=a.match(/^\s*(sep|end)\s*=(.*)$/);
      if(kw){const val=fmt(expr(kw[2],v,io)).replace(/\\n/g,'\n');kw[1]==='sep'?sep=val:end=val}
      else args.push(fmt(expr(a,v,io)))}}
    io.out+=args.join(sep)+end;
   }else if((m=t.match(/^([A-Za-zА-Яа-я_]\w*)\s*(\*\*|\/\/|[-+*\/%])=\s*(.+)$/))){if(!(m[1] in v))throw Error(`Я не знаю слова «${m[1]}». Сначала положи в неё значение.`);v[m[1]]=bin(m[2],v[m[1]],expr(m[3],v,io))}
   else if((m=t.match(/^([A-Za-zА-Яа-я_]\w*)\s*=\s*(.+)$/))){v[m[1]]=expr(m[2],v,io)}
   else if(/^Print\(/i.test(t)&&!/^print\(/.test(t))throw Error('Пиши print маленькими буквами — Python различает большие и маленькие.');else if(/^[A-Za-zА-Яа-я_]\w*\s*\[.*\]\s*=[^=]/.test(t))throw Error('Строку нельзя менять по частям: s[0] = ... не работает. Собери новую строку склейкой.');
   else throw Error(`Не понимаю «${t}». Проверь скобки и кавычки.`);
  }catch(e){throw e.message.startsWith('Строка')?e:at(e.message)}}

   if(!k||(first?k[1]!=='if':k[1]==='if'))break;

   if(!m)throw Error(`Строка ${l.n}: в конце строки с ${k[1]} нужно двоеточие :`);

   let c=true;if(m[1]!=='else'&&!taken){try{c=truthy(expr(m[2],v,io))}catch(e){throw Error(`Строка ${l.n}: ${e.message}`)}}
   p++;if(!(p<L.length&&L[p].ind>ind))throw Error(`Строка ${l.n}: после двоеточия нужна строка с отступом — 4 пробела слева.`);

  if(!w&&!g)throw E(/^while/.test(l.t)?'в конце строки с while нужно двоеточие :':'цикл пиши так: for i in range(5):');
  if(w&&!w[1])throw E('после while нужно условие.');

  const code=ed.value,con=$('#con');
  if(!code.trim()){say('Тут пусто! Напиши команду — иначе мне нечего проверять.','bad');return}
  if(code===lastTry){say('Такой код ты уже запускал, и я уже сказал, в чём ошибка. Поменяй что-нибудь и попробуй снова!','bad');return}
  lastTry=code;
  try{const o=run(code,s.inp||[]);con.className='out';con.innerHTML=`<pre>${esc(o)||' '}</pre>`;
   const bad=s.check(code,i=>run(code,i));
   if(bad){fail(bad,s);return}
   passed[step]=true;nav();mood('happy');meter(0);say(fails>=3?pick(CALM):pick(OK),'ok');
   const g=$('#go');g.dataset.ok=1;g.textContent='Дальше';g.classList.add('good');ed.readOnly=true;
  }catch(e){con.className='out err';con.innerHTML=`<pre>${esc(e.message)}</pre>`;fail(e.message,s)}};
}
function fail(msg,s){fails++;total++;log[step]=fails;const L=Math.min(fails,4);mood('angry',L);meter(fails);
 let t=pick(BAD[L-1])+' '+msg;
 if(fails>=2)t+='\nПодсказка: '+s.hint;
 if(fails>=6)t+='\nВот ответ, перепиши его сам:\n'+s.sol;
 say(t,'bad');
 if(L<3)setTimeout(()=>{if($('#r1').classList.contains('angry'))mood('idle')},1600)}

/* ---------- «На главную» с анимацией Бипа ---------- */
const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;
$('#ovRobot').innerHTML=ROBOT;
const ov=$('#ov'),ovName=$('#ovName'),ovFill=$('#ovFill'),ovStatus=$('#ovStatus');
let launching=false;
document.querySelectorAll("[data-home]").forEach(a=>{
 a.addEventListener("click",e=>{
  if(e.metaKey||e.ctrlKey||e.shiftKey||e.button!==0)return;
  e.preventDefault();
  if(launching)return;launching=true;
  ov.classList.add("show");ov.setAttribute("aria-hidden","false");
  ovName.textContent="Возвращаемся к выбору курса";
  const stages=["Бип собирает вещи…","Заводит моторчик…","Едем домой!"];
  let i=0;
  (function next(){
   if(i<stages.length){ovStatus.textContent=stages[i];ovFill.style.width=((i+1)/stages.length)*100+"%";i++;setTimeout(next,reduceMotion?60:Math.round(200/stages.length))}
   else setTimeout(()=>{location.href=a.getAttribute("href")},reduceMotion?30:50);
  })();
 });
});

/* ---------- возврат кнопками браузера «Назад»/«Вперёд» (страница берётся из кэша) ---------- */
addEventListener("pageshow",()=>{
 launching=false;
 ov.classList.remove("show");ov.setAttribute("aria-hidden","true");
 ovFill.style.width="0";ovStatus.textContent="Бип подключается…";
});

/* ---------- светлая / тёмная тема ---------- */
(function(){
 const root=document.documentElement,btn=$('#themeBtn');
 function apply(t){root.setAttribute("data-theme",t);const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==="dark"?"#151829":"#fff7e6"}
 apply(root.getAttribute("data-theme")||"light");
 btn.addEventListener("click",()=>{
  const t=root.getAttribute("data-theme")==="dark"?"light":"dark";
  root.classList.add("theme-anim");apply(t);
  try{localStorage.setItem("bip-theme",t)}catch(e){}
  setTimeout(()=>root.classList.remove("theme-anim"),450);
 });
 addEventListener("storage",e=>{if(e.key==="bip-theme"&&(e.newValue==="dark"||e.newValue==="light"))apply(e.newValue)});
})();
</script>
</body>
