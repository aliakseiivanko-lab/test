const stat=(t,c)=>{$('stat').textContent='Статус: '+t;$('stat').style.color=c||''};
let tt;const toast=t=>{const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',2500)};

const S={stop:false,busy:false};let CI=null,RQ=Promise.resolve(),TK=null,DEAD=0;
const OUT0=t=>{$('out').textContent+=t;$('out').scrollTop=1e9};let OUT=OUT0;
const CONS=p=>new Promise((res,rej)=>{const r=$('inr'),i=$('inp');$('ip').textContent=p||'';r.classList.add('on');i.value='';i.focus();
 CI={res:v=>{r.classList.remove('on');CI=null;OUT0((p||'')+v+'\n');res(v)},rej:()=>{r.classList.remove('on');CI=null;rej('STOP')}}});
let INPF=CONS;
/* ===== Python через Skulpt (https://skulpt.org) ===== */
const Q=[];
const exec=async(code,inp,lim)=>{
 if(!(await window.SKP))throw{m:'Не удалось загрузить интерпретатор Python (Skulpt). Проверьте интернет и обновите страницу.'};
 Q.length=0;if(inp)Q.push(...inp);
 Sk.configure({output:t=>OUT(t),inputfun:p=>Q.length?String(Q.shift()):INPF(p),inputfunTakesPrompt:true,__future__:Sk.python3,execLimit:lim||null,yieldLimit:100,
  read:f=>{if(Sk.builtinFiles===undefined||Sk.builtinFiles.files[f]===undefined)throw"File not found: '"+f+"'";return Sk.builtinFiles.files[f]}});
 Sk.execStart=Date.now();
 await Sk.misceval.asyncToPromise(()=>Sk.importMainWithBody('<stdin>',false,code,true))};
/* запуск без экрана для проверки заданий: ввод берётся из теста, вывод собирается в строку */
async function cap(code,inp,lim){let o='',er='';OUT=t=>{o+=t};
 INPF=()=>{throw new Error('Программа просит ввести больше данных, чем задано в тесте')};
 S.stop=false;
 try{await exec(code,inp.map(String),lim)}catch(e){er=/TimeLimit/.test(String(e))?'Превышено время выполнения (бесконечный цикл?)':errTxt(e).m}
 finally{OUT=OUT0;INPF=CONS}return{o,er}}
const errTxt=e=>{
 if(e instanceof Error)return{ln:0,m:e.message};
 if(e&&typeof e=='object'&&typeof e.m=='string')return{ln:0,m:e.m};
 const t=e&&e.traceback&&e.traceback[0];let m=String(e);
 const ln=(t&&t.lineno)||+((/ on line (\d+)/.exec(m)||[])[1])||0;
 return{ln,m:m.replace(/\s+on line \d+\s*$/,'')}};
const msg=t=>{$('msg').textContent=t||''};
const clearRes=()=>{$('tp').classList.add('hid');$('tp').innerHTML=''};
const hl=n=>{const ta=$('ta'),L=ta.value.split('\n');let p=0;for(let i=0;i<n-1;i++)p+=L[i].length+1;ta.focus();ta.setSelectionRange(p,p+(L[n-1]||'').length)};
async function run(){
 if(S.busy)return;T[cur].t=$('ta').value;S.stop=false;DEAD=0;$('out').textContent='';msg('');clearRes();stat('Выполняется…','blue');S.busy=true;
 try{await exec($('ta').value);stat(S.stop?'Выполнение остановлено':'Готово',S.stop?'red':'green')}
 catch(e){if(e==='STOP'||S.stop)stat('Выполнение остановлено','red');else{const r=errTxt(e);$('out').innerHTML+=`<span style="color:#c00">${esc((r.ln?'Ошибка в строке '+r.ln+': ':'')+r.m)}</span>`;stat('Ошибка выполнения','red');if(r.ln)hl(r.ln)}}
 finally{S.busy=false;$('inr').classList.remove('on');CI=null}}
const stop=()=>{S.stop=true;if(CI)CI.rej();if(window.Sk)Sk.execLimit=1};
function reset(){stop();$('out').textContent='';msg('');clearRes();if(T[cur]){T[cur].task=null;T[cur].solved=false;T[cur].t='';T[cur].v=null;$('ta').value='';hlRender()}syncTask();stat('Задание и консоль сброшены')}
const ed=c=>()=>{$('ta').focus();document.execCommand(c)};
$('inp').onkeydown=e=>{if(e.key=='Enter'&&CI)CI.res($('inp').value)};$('inb').onclick=()=>CI&&CI.res($('inp').value);
/* запуск программы без экрана: для проверки заданий (ввод берётся из теста, вывод собирается в строку) */

const norm=s=>s.replace(/\r/g,'').split('\n').map(l=>l.trim().split(/\s+/).filter(Boolean)).filter(l=>l.length);
const same=(p,q)=>{q=norm(q).flat();p=[norm(p).flat().slice(-q.length)];q=[q];return p.length==q.length&&p.every((l,i)=>l.length==q[i].length&&l.every((w,j)=>{const u=q[i][j];if(w===u)return true;const x=+w,y=+u;return !isNaN(x)&&!isNaN(y)&&Math.abs(x-y)<=1e-6*Math.max(1,Math.abs(y))}))};

<script>
(function(){
  var root=document.documentElement,btn=document.getElementById("themeBtn");
  function apply(t){root.setAttribute("data-theme",t);var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==="dark"?"#151829":"#eef1f5";}
  apply(root.getAttribute("data-theme")||"light");
  btn.addEventListener("click",function(){var t=root.getAttribute("data-theme")==="dark"?"light":"dark";apply(t);try{localStorage.setItem("bip-theme",t)}catch(e){}});
  addEventListener("storage",function(e){if(e.key==="bip-theme"&&(e.newValue==="dark"||e.newValue==="light"))apply(e.newValue);});
})();
</script>
